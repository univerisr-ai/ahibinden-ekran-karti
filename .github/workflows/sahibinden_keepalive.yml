name: Sahibinden Session Keepalive

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *' # Best-effort profil tazeleme; challenge olursa ana scraper'i kirmiziya dusurmez.

permissions:
  contents: read
  actions: write

concurrency:
  group: sahibinden-profile-cache
  cancel-in-progress: false

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Kodu indir
        uses: actions/checkout@v3

      - name: Node.js kurulumu
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Paketleri yukle
        run: npm ci

      - name: Google Chrome'u kur
        run: |
          npx playwright install chrome
          npx playwright install-deps chrome

      - name: Cloudflare WARP proxy kurulumu
        if: vars.USE_WARP_PROXY == 'true' || vars.DOLAP_USE_WARP_PROXY == 'true'
        id: warp
        shell: bash
        run: |
          set -u
          if (
            set -euo pipefail
            curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg | sudo gpg --yes --dearmor --output /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
            echo "deb [arch=amd64 signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/cloudflare-client.list
            sudo apt-get update
            sudo apt-get install -y cloudflare-warp xvfb
            warp-cli --accept-tos registration new || warp-cli --accept-tos register
            warp-cli --accept-tos mode proxy || warp-cli --accept-tos set-mode proxy
            warp-cli --accept-tos proxy port 40000 || warp-cli --accept-tos set-proxy-port 40000
            warp-cli --accept-tos connect
            sleep 8
            warp-cli --accept-tos status
            curl -fsS -x socks5h://127.0.0.1:40000 https://www.cloudflare.com/cdn-cgi/trace | tee warp-trace.txt
          ); then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "proxy_url=socks5://127.0.0.1:40000" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Cloudflare WARP proxy setup failed; continuing without WARP proxy."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "proxy_url=" >> "$GITHUB_OUTPUT"
          fi

      - name: Sahibinden Playwright profil cache
        uses: actions/cache@v4
        with:
          path: .playwright/sahibinden-profile
          key: sahibinden-playwright-profile-v2-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            sahibinden-playwright-profile-v2-${{ runner.os }}-

      - name: Session keepalive calistir
        env:
          USE_WARP_PROXY: ${{ steps.warp.outputs.enabled || 'false' }}
          SAHIBINDEN_PROXY_SERVER: ${{ secrets.SAHIBINDEN_PROXY_SERVER || vars.SAHIBINDEN_PROXY_SERVER || secrets.DOLAP_PROXY_SERVER || vars.DOLAP_PROXY_SERVER || '' }}
          DOLAP_PROXY_SERVER: ${{ steps.warp.outputs.proxy_url || secrets.DOLAP_PROXY_SERVER || vars.DOLAP_PROXY_SERVER || '' }}
          USE_SCRAPEDO_PROXY: 'false'
          HEADLESS: 'false'
          CHALLENGE_WAIT_MS: '120000'
          SAHIBINDEN_PERSISTENT_CONTEXT: 'true'
          SAHIBINDEN_USER_DATA_DIR: .playwright/sahibinden-profile
          SAHIBINDEN_STORAGE_STATE_B64: ${{ secrets.SAHIBINDEN_STORAGE_STATE_B64 }}
          SAHIBINDEN_COOKIES: ${{ secrets.SAHIBINDEN_COOKIES }}
        run: |
          set +e
          set -o pipefail
          xvfb-run --auto-servernum --server-args="-screen 0 1366x768x24" node scripts/sahibinden-keepalive.mjs 2>&1 | tee keepalive.log
          keepalive_code=${PIPESTATUS[0]}
          set -e

          if [ "${keepalive_code}" -eq 0 ]; then
            exit 0
          fi

          if grep -Eq 'CHALLENGE_TIMEOUT|SOURCE_BLOCKED|Cloudflare|challenge' keepalive.log; then
            echo "::warning::Keepalive dis erisim/challenge nedeniyle yenilenemedi. Ana scraper son WARP kosusunda ilan cekebildi; kanit artifact'i yuklenecek."
            touch .keepalive-blocked
            exit 0
          fi

          exit "${keepalive_code}"

      - name: Challenge olduysa profil cache kaydini iptal et
        if: always()
        run: |
          if [ -f .keepalive-blocked ]; then
            echo "Challenge profili cache'e yazilmasin diye profil klasoru temizleniyor."
            rm -rf .playwright/sahibinden-profile
          fi

      - name: Eski profil cachelerini temizle
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          CACHE_PREFIX: sahibinden-playwright-profile-v2-${{ runner.os }}-
        run: |
          set +e
          gh api "/repos/${GITHUB_REPOSITORY}/actions/caches?key=${CACHE_PREFIX}&per_page=100" \
            --jq '.actions_caches | sort_by(.last_accessed_at) | reverse | .[6:] | .[].id' |
          while read -r cache_id; do
            [ -n "$cache_id" ] && gh api -X DELETE "/repos/${GITHUB_REPOSITORY}/actions/caches/${cache_id}" || true
          done

      - name: Kanitlari artifact olarak al
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sahibinden-keepalive
          path: |
            cf_proof.png
            keepalive.log
          if-no-files-found: warn
