name: Sahibinden Session Keepalive

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'

permissions:
  contents: read

concurrency:
  group: sahibinden-profile-cache
  cancel-in-progress: false

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    container:
      image: ghcr.io/univerisr-ai/ahibinden-ekran-karti/scraper:latest
      options: --privileged --user root

    steps:
      - name: Kodu indir
        uses: actions/checkout@v4

      - name: Cache Playwright storage state
        id: cache_state
        uses: actions/cache@v4
        with:
          path: .playwright/storage-state.json
          key: sahibinden-storage-state-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            sahibinden-storage-state-${{ runner.os }}-

      - name: Start Camoufox Server
        id: camoufox_server
        shell: bash
        env:
          HOME: /root
          CAMOUFOX_HEADLESS: false
        run: |
          xvfb-run -a python3 scripts/camoufox-server.py > /tmp/camoufox-server.log 2>&1 &
          SERVER_PID=$!
          echo "server_pid=$SERVER_PID" >> "$GITHUB_OUTPUT"
          for i in $(seq 1 60); do
            if grep -q "Websocket endpoint" /tmp/camoufox-server.log 2>/dev/null; then
              WS=$(grep -oP 'ws://[^\s]+' /tmp/camoufox-server.log | head -1)
              echo "camoufox_ws=$WS" >> "$GITHUB_OUTPUT"
              echo "Camoufox server ready: $WS"
              break
            fi
            sleep 2
          done
          if [ -z "$WS" ]; then
            echo "Camoufox server failed to start"
            cat /tmp/camoufox-server.log
            exit 1
          fi

      - name: Session keepalive calistir
        shell: bash
        env:
          CAMOUFOX_WS_ENDPOINT: ${{ steps.camoufox_server.outputs.camoufox_ws }}
          HEADLESS: 'true'
          SAHIBINDEN_STORAGE_STATE_FILE: .playwright/storage-state.json
          SAHIBINDEN_STORAGE_STATE_B64: ${{ secrets.SAHIBINDEN_STORAGE_STATE_B64 }}
          SAHIBINDEN_COOKIES: ${{ secrets.SAHIBINDEN_COOKIES }}
        run: |
          set -o pipefail
          node scripts/sahibinden-keepalive.mjs 2>&1 | tee keepalive.log

      - name: Kill Camoufox
        if: always()
        shell: bash
        run: |
          kill ${{ steps.camoufox_server.outputs.server_pid }} 2>/dev/null || true

      - name: Kanitlari artifact olarak al
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sahibinden-keepalive
          path: |
            cf_proof.png
            keepalive.log
          if-no-files-found: warn

      - name: Telegram failure alert
        uses: appleboy/telegram-action@master
        if: failure()
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN_1 }}
          format: markdown
          message: |
            Keepalive Basarisiz!
            Repo: ${{ github.repository }}
            Run: [${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
            Oturum yenileme basarisiz. Cookie'ler guncellenemedi.
