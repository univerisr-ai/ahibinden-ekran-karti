name: GPU Firsat Avcisi — Sahibinden Scraper

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:
    inputs:
      min_fiyat:
        description: 'Minimum fiyat (TL)'
        required: false
        default: ''
      max_fiyat:
        description: 'Maximum fiyat (TL)'
        required: false
        default: ''
      bypass_ai:
        description: 'AI analizini atla'
        required: false
        type: boolean
        default: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  scrape:
    name: Scrape & Analyze
    runs-on: ubuntu-latest
    timeout-minutes: 120

    services:
      flaresolverr:
        image: ghcr.io/flaresolverr/flaresolverr:latest
        env:
          LOG_LEVEL: info
          CAPTCHA_SOLVER: none
        ports:
          - 8191:8191

    steps:
      - name: Haftalik run politikasi (2 rastgele gun)
        id: run_policy
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual tetikleme: policy bypass."
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "jitter_seconds=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${{ vars.PIPELINE_PAUSED }}" = "true" ]; then
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "jitter_seconds=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          week="$(date -u +%G-%V)"
          dow="$(date -u +%u)"
          seed_input="${GITHUB_REPOSITORY}|${week}|sahibinden-weekly-two-days"
          seed_hash="$(printf "%s" "$seed_input" | sha256sum | cut -d' ' -f1)"
          day1_seed=$((16#${seed_hash:0:6}))
          day2_seed=$((16#${seed_hash:6:6}))
          allowed_days="$((day1_seed % 7 + 1)) $((day2_seed % 7 + 1))"
          if echo " $allowed_days " | grep -q " $dow "; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            jitter=$((day1_seed % 3600))
            echo "jitter_seconds=$jitter" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "jitter_seconds=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.run_policy.outputs.should_run == 'true'
        uses: actions/checkout@v4

      - name: Node.js Kurulumu
        if: steps.run_policy.outputs.should_run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Bagimliliklari Yukle
        if: steps.run_policy.outputs.should_run == 'true'
        shell: bash
        run: |
          npm ci --no-optional --ignore-scripts 2>&1 | tail -5

      - name: Schedule jitter beklemesi
        if: steps.run_policy.outputs.should_run == 'true' && github.event_name == 'schedule'
        shell: bash
        run: |
          sleep "${{ steps.run_policy.outputs.jitter_seconds }}"

      - name: GPU Firsat Avcisini Calistir
        id: runner
        if: steps.run_policy.outputs.should_run == 'true'
        shell: bash
        env:
          HEADLESS: 'true'
          REQUIRE_SAHIBINDEN_COOKIES: 'false'

          SAHIBINDEN_STORAGE_STATE_B64: ${{ secrets.SAHIBINDEN_STORAGE_STATE_B64 }}
          SAHIBINDEN_COOKIES: ${{ secrets.SAHIBINDEN_COOKIES }}

          TELEGRAM_BOT_TOKEN_1: ${{ secrets.TELEGRAM_BOT_TOKEN_1 }}
          TELEGRAM_BOT_TOKEN_2: ${{ secrets.TELEGRAM_BOT_TOKEN_2 }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ENABLE_TELEGRAM: 'false'

          ANALYZER_DISPATCH_TOKEN: ${{ secrets.ANALYZER_DISPATCH_TOKEN }}
          ANALYZER_REPO_OWNER: ${{ vars.ANALYZER_REPO_OWNER || '' }}
          ANALYZER_REPO_NAME: ${{ vars.ANALYZER_REPO_NAME || '' }}
          ANALYZER_DISPATCH_EVENT: ${{ vars.ANALYZER_DISPATCH_EVENT || '' }}
          AI_PROVIDER: ${{ vars.AI_PROVIDER || '' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL || '' }}
          CUSTOM_MIN_PRICE: ${{ inputs.min_fiyat || '' }}
          CUSTOM_MAX_PRICE: ${{ inputs.max_fiyat || '' }}
          BYPASS_AI: ${{ inputs.bypass_ai || vars.BYPASS_AI || 'true' }}
        run: |
          node src/main.mjs 2>&1 | tee scraper.log

      - name: Sonuclari Kaydet (Artifact)
        if: always() && steps.run_policy.outputs.should_run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: scraper-results-${{ github.run_id }}
          path: |
            output.json
            pipeline-messages.json
            scraper.log
            cf_proof.png*
            screenshots/
          if-no-files-found: ignore

      - name: Hata bildirimi
        if: failure() && steps.run_policy.outputs.should_run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          summary="$(grep -m 1 -E 'Error:|ERR!|Traceback|Exception|FATAL|KRITIK|CRITICAL|❌' scraper.log || true)"
          if [ -z "$summary" ]; then
            summary="$(grep -m 1 -E 'Error:|ERR!|Traceback|Exception|FATAL|KRITIK|CRITICAL|❌' failed.log || true)"
          fi
          if [ -z "$summary" ]; then
            summary="Bilinmeyen hata (scraper.log ve failed.log kontrol edin)"
          fi
          echo "Hata ozeti: $summary"
          echo "summary=$summary" >> "$GITHUB_OUTPUT"

      - name: Telegram failure alert
        uses: appleboy/telegram-action@master
        if: failure() && steps.run_policy.outputs.should_run == 'true'
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN_1 }}
          format: markdown
          message: |
            ❌ *GPU Scraper Failed* ❌
            Repo: ${{ github.repository }}
            Run: [${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
            Error: ${{ steps.runner.outputs.summary || 'unknown' }}

      - name: Eski profil cachelerini temizle
        if: always() && steps.run_policy.outputs.should_run == 'true'
        shell: bash
        run: |
          rm -rf .playwright ~/.cache/ms-playwright ~/.cache/camoufox ~/.local/share/camoufox
