name: GPU Firsat Avcisi - Sahibinden Scraper

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:
    inputs:
      min_fiyat:
        description: 'Minimum fiyat (TL)'
        required: false
        default: ''
      max_fiyat:
        description: 'Maximum fiyat (TL)'
        required: false
        default: ''
      bypass_ai:
        description: 'AI analizini atla'
        required: false
        type: boolean
        default: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  scrape:
    name: Scrape & Analyze
    runs-on: ubuntu-latest
    timeout-minutes: 120
    container:
      image: ghcr.io/univerisr-ai/ahibinden-ekran-karti/scraper:latest
      options: --privileged --user root

    steps:
      - name: Run policy
        id: run_policy
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "jitter_seconds=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${{ vars.PIPELINE_PAUSED }}" = "true" ]; then
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          week="$(date -u +%G-%V)"
          dow="$(date -u +%u)"
          seed_input="${GITHUB_REPOSITORY}|${week}|sahibinden-weekly-two-days"
          seed_hash="$(printf "%s" "$seed_input" | sha256sum | cut -d' ' -f1)"
          day1_seed=$((16#${seed_hash:0:6}))
          day2_seed=$((16#${seed_hash:6:6}))
          allowed_days="$((day1_seed % 7 + 1)) $((day2_seed % 7 + 1))"
          if echo " $allowed_days " | grep -q " $dow "; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "jitter_seconds=$((day1_seed % 3600))" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.run_policy.outputs.should_run == 'true'
        uses: actions/checkout@v4

      - name: WARP Proxy
        if: steps.run_policy.outputs.should_run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          warp-svc > /tmp/warp-svc.log 2>&1 &
          sleep 4
          warp-cli --accept-tos registration new 2>/dev/null || warp-cli --accept-tos register
          warp-cli --accept-tos mode proxy 2>/dev/null || warp-cli --accept-tos set-mode proxy
          warp-cli --accept-tos proxy port 40000 2>/dev/null || warp-cli --accept-tos set-proxy-port 40000
          warp-cli --accept-tos connect
          sleep 8
          warp-cli --accept-tos status
          curl -fsS -x socks5h://127.0.0.1:40000 https://www.cloudflare.com/cdn-cgi/trace | tee warp-trace.txt

      - name: Detect Firefox path
        if: steps.run_policy.outputs.should_run == 'true'
        shell: bash
        run: |
          FF_PATH=$(NODE_PATH=/app/node_modules node -e "const p = require('playwright'); console.log(p.firefox.executablePath())" 2>/dev/null || NODE_PATH=/app/node_modules node -e "const p = require('playwright-core'); console.log(p.firefox.executablePath())")
          echo "CAMOUFOX_BROWSER_PATH=$FF_PATH" >> "$GITHUB_ENV"
          echo "Firefox binary: $FF_PATH"

      - name: Start Camoufox Server
        if: steps.run_policy.outputs.should_run == 'true'
        id: camoufox_server
        shell: bash
        run: |
          export CAMOUFOX_HEADLESS=true
          export CAMOUFOX_PROXY=socks5://127.0.0.1:40000
          xvfb-run python3 scripts/camoufox-server.py > /tmp/camoufox-server.log 2>&1 &
          SERVER_PID=$!
          echo "server_pid=$SERVER_PID" >> "$GITHUB_OUTPUT"
          for i in $(seq 1 60); do
            if grep -q "Websocket endpoint" /tmp/camoufox-server.log 2>/dev/null; then
              WS=$(grep -oP 'ws://[^\s]+' /tmp/camoufox-server.log | head -1)
              echo "camoufox_ws=$WS" >> "$GITHUB_OUTPUT"
              echo "Camoufox server ready: $WS"
              break
            fi
            sleep 2
          done
          if [ -z "$WS" ]; then
            echo "Camoufox server failed to start"
            cat /tmp/camoufox-server.log
            exit 1
          fi

      - name: Scraper
        if: steps.run_policy.outputs.should_run == 'true'
        shell: bash
        env:
          CAMOUFOX_WS_ENDPOINT: ${{ steps.camoufox_server.outputs.camoufox_ws }}
          HEADLESS: 'true'
          REQUIRE_SAHIBINDEN_COOKIES: 'false'

          SAHIBINDEN_STORAGE_STATE_B64: ${{ secrets.SAHIBINDEN_STORAGE_STATE_B64 }}
          SAHIBINDEN_COOKIES: ${{ secrets.SAHIBINDEN_COOKIES }}

          TELEGRAM_BOT_TOKEN_1: ${{ secrets.TELEGRAM_BOT_TOKEN_1 }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ENABLE_TELEGRAM: 'false'

          ANALYZER_DISPATCH_TOKEN: ${{ secrets.ANALYZER_DISPATCH_TOKEN }}
          AI_PROVIDER: ${{ vars.AI_PROVIDER || '' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CUSTOM_MIN_PRICE: ${{ inputs.min_fiyat || '' }}
          CUSTOM_MAX_PRICE: ${{ inputs.max_fiyat || '' }}
          BYPASS_AI: ${{ inputs.bypass_ai || vars.BYPASS_AI || 'true' }}
        run: |
          node src/main.mjs 2>&1 | tee scraper.log

      - name: Kill Camoufox
        if: always() && steps.run_policy.outputs.should_run == 'true'
        shell: bash
        run: |
          kill ${{ steps.camoufox_server.outputs.server_pid }} 2>/dev/null || true

      - name: Upload artifact
        if: always() && steps.run_policy.outputs.should_run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: scraper-results-${{ github.run_id }}
          path: |
            output.json
            scraper.log
            warp-trace.txt
            cf_proof.png
            screenshots/
          if-no-files-found: ignore

      - name: Error alert
        if: failure() && steps.run_policy.outputs.should_run == 'true'
        shell: bash
        run: |
          summary="$(grep -m 1 -E 'Error:|ERR!|?' scraper.log 2>/dev/null || echo 'unknown')"
          echo "summary=$summary" >> "$GITHUB_OUTPUT"

      - name: Telegram alert
        uses: appleboy/telegram-action@master
        if: failure() && steps.run_policy.outputs.should_run == 'true'
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN_1 }}
          format: markdown
          message: |
            GPU Scraper Failed
            Repo: ${{ github.repository }}
            Run: [${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
