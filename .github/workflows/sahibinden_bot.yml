name: Sahibinden Bot (GitHub Actions)

on:
  workflow_dispatch: # GitHub üzerinden manuel olarak "Run workflow" butonu ile çalıştırmak için
    inputs:
      headless:
        description: 'Chrome headless calissin mi?'
        required: true
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'
      max_pages_per_segment:
        description: 'Segment basina maksimum sayfa'
        required: true
        default: '40'
  schedule:
    # Haftada iki yenileme penceresi; GitHub cron yogunluguna takilmamak icin garip dakikalar.
    # Turkiye saati: Sali 07:57, Cumartesi 21:13.
    - cron: '57 4 * * 2'
    - cron: '13 18 * * 6'

concurrency:
  group: sahibinden-profile-cache
  cancel-in-progress: false

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    
    steps:
    - name: Kodu İndir
      uses: actions/checkout@v3

    - name: Node.js Kurulumu
      uses: actions/setup-node@v3
      with:
        node-version: '20'

    - name: Gerekli Paketleri Yükle
      run: npm install

    # --- ZenRows modu: Playwright/WARP adimlari devre disi ---
    # - name: Google Chrome'u Kur (Playwright için)
    #   run: |
    #     npx playwright install chrome
    #     npx playwright install-deps chrome

    # - name: Cloudflare WARP Proxy Kurulumu
    #   if: vars.USE_WARP_PROXY == 'true' || vars.DOLAP_USE_WARP_PROXY == 'true'
    #   id: warp
    #   shell: bash
    #   run: |
    #     set -u
    #     if (
    #       set -euo pipefail
    #       curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg | sudo gpg --yes --dearmor --output /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
    #       echo "deb [arch=amd64 signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/cloudflare-client.list
    #       sudo apt-get update
    #       sudo apt-get install -y cloudflare-warp xvfb
    #       warp-cli --accept-tos registration new || warp-cli --accept-tos register
    #       warp-cli --accept-tos mode proxy || warp-cli --accept-tos set-mode proxy
    #       warp-cli --accept-tos proxy port 40000 || warp-cli --accept-tos set-proxy-port 40000
    #       warp-cli --accept-tos connect
    #       sleep 8
    #       warp-cli --accept-tos status
    #       curl -fsS -x socks5h://127.0.0.1:40000 https://www.cloudflare.com/cdn-cgi/trace | tee warp-trace.txt
    #     ); then
    #       echo "enabled=true" >> "$GITHUB_OUTPUT"
    #       echo "proxy_url=socks5://127.0.0.1:40000" >> "$GITHUB_OUTPUT"
    #     else
    #       echo "::warning::Cloudflare WARP proxy setup failed; continuing without WARP proxy."
    #       echo "enabled=false" >> "$GITHUB_OUTPUT"
    #       echo "proxy_url=" >> "$GITHUB_OUTPUT"
    #     fi

    # - name: Sahibinden Playwright Profil Cache
    #   uses: actions/cache@v4
    #   with:
    #     path: .playwright/sahibinden-profile
    #     key: sahibinden-playwright-profile-v2-${{ runner.os }}-${{ github.run_id }}
    #     restore-keys: |
    #       sahibinden-playwright-profile-v2-${{ runner.os }}-

    - name: Botu Başlat
      env:
        USE_ZENROWS: 'true'
        ZENROWS_API_KEY: ${{ secrets.ZENROWS_API_KEY }}
        HEADLESS: ${{ inputs.headless || 'false' }}
        MAX_PAGES_PER_SEGMENT: ${{ github.event_name == 'schedule' && '30' || inputs.max_pages_per_segment || '40' }}
        MAX_CREDITS_PER_RUN: '1000'
        SAHIBINDEN_PERSISTENT_CONTEXT: 'true'
        SAHIBINDEN_USER_DATA_DIR: .playwright/sahibinden-profile
        SAHIBINDEN_STORAGE_STATE_B64: ${{ secrets.SAHIBINDEN_STORAGE_STATE_B64 }}
        SAHIBINDEN_COOKIES: ${{ secrets.SAHIBINDEN_COOKIES }}
      run: |
        set +e
        node src/main.mjs 2>&1 | tee scraper.log
        scraper_code=${PIPESTATUS[0]}

        echo "SCRAPER_EXIT_CODE=$scraper_code" >> "$GITHUB_ENV"

        node --input-type=module <<'NODE'
        import fs from 'node:fs';

        const now = new Date().toISOString();
        const runId = process.env.GITHUB_RUN_ID || '';
        const repository = process.env.GITHUB_REPOSITORY || '';
        const runUrl = runId && repository ? `https://github.com/${repository}/actions/runs/${runId}` : '';
        const artifactName = runId ? `scraper-results-${runId}` : '';
        const log = fs.existsSync('scraper.log') ? fs.readFileSync('scraper.log', 'utf8') : '';

        function classifyFallback() {
          const lower = log.toLowerCase();

          if (
            lower.includes('storage_state_parse_invalid') ||
            lower.includes('storage_state_schema_invalid') ||
            lower.includes('cookie_parse_invalid') ||
            lower.includes('cookie_schema_invalid') ||
            lower.includes('cookie_add_failed')
          ) {
            return {
              scrapeStatus: 'SCRAPE_CONFIG_ERROR',
              pipelineStatus: 'CONFIG_ERROR',
              message: 'Sahibinden oturum/config formati hatali; secret veya auth state duzeltilmeli.',
            };
          }

          if (
            lower.includes('cookie_empty_after_filter') ||
            lower.includes('kullanilabilir cookie kalmadi')
          ) {
            return {
              scrapeStatus: 'SCRAPE_AUTH_EXPIRED',
              pipelineStatus: 'AUTH_EXPIRED',
              message: 'Sahibinden cookie/storage state icinde kullanilabilir oturum kalmadi.',
            };
          }

          if (
            lower.includes('auth_required') ||
            lower.includes('cookie_required_missing') ||
            lower.includes('login gerekli') ||
            lower.includes('oturum secret')
          ) {
            return {
              scrapeStatus: 'SCRAPE_AUTH_REQUIRED',
              pipelineStatus: 'AUTH_REQUIRED',
              message: 'Sahibinden login gerekli sayfaya dustu. Cookie/storage state yenilenmeli.',
            };
          }

          if (
            lower.includes('challenge') ||
            lower.includes('cloudflare') ||
            lower.includes('cf_proof') ||
            lower.includes('blocked') ||
            lower.includes('erisim')
          ) {
            return {
              scrapeStatus: 'SCRAPE_BLOCKED',
              pipelineStatus: 'SOURCE_BLOCKED',
              message: 'Sahibinden erisim/challenge nedeniyle tarama durdu.',
            };
          }

          return {
            scrapeStatus: 'SCRAPE_FAILED',
            pipelineStatus: 'SCRAPE_FAILED',
            message: 'Sahibinden scraper output uretmeden tamamlandi veya hata verdi.',
          };
        }

        function readOutput() {
          if (!fs.existsSync('output.json')) return null;

          try {
            const output = JSON.parse(fs.readFileSync('output.json', 'utf8'));
            const listingCount = Number(output.runMeta?.listingCount ?? output.totalClean ?? output.allListings?.length ?? 0);
            const scrapeStatus = String(output.runMeta?.scrapeStatus || (listingCount > 0 ? 'SCRAPE_COMPLETED' : 'SCRAPE_EMPTY'));

            return { output, scrapeStatus, listingCount };
          } catch (err) {
            return {
              output: null,
              scrapeStatus: 'SCRAPE_OUTPUT_INVALID',
              listingCount: 0,
              parseError: err.message,
            };
          }
        }

        let current = readOutput();
        if (!current || current.scrapeStatus === 'SCRAPE_OUTPUT_INVALID') {
          const fallback = current?.scrapeStatus === 'SCRAPE_OUTPUT_INVALID'
            ? {
                scrapeStatus: 'SCRAPE_OUTPUT_INVALID',
                pipelineStatus: 'OUTPUT_INVALID',
                message: `output.json okunamadi: ${current.parseError}`,
              }
            : classifyFallback();

          const output = {
            timestamp: now,
            sessionNumber: Number(process.env.SESSION_NUMBER || 1),
            stats: {},
            totalRaw: 0,
            totalClean: 0,
            segmentBreakdown: [],
            topDeals: [],
            allListings: [],
            elapsedSeconds: 0,
            isFallback: true,
            runMeta: {
              repository,
              githubRunId: runId,
              githubRunUrl: runUrl,
              artifactName,
              startedAt: '',
              finishedAt: now,
              scrapeStatus: fallback.scrapeStatus,
              listingCount: 0,
            },
          };

          const messages = [
            {
              service: 'scraper',
              status: fallback.pipelineStatus,
              message: fallback.message,
              timestamp: now,
            },
          ];

          fs.writeFileSync('output.json', JSON.stringify(output, null, 2));
          fs.writeFileSync('pipeline-messages.json', JSON.stringify(messages, null, 2));
          current = { output, scrapeStatus: fallback.scrapeStatus, listingCount: 0 };
          console.log(`Fallback output.json yazildi: ${fallback.scrapeStatus}`);
        } else if (!fs.existsSync('pipeline-messages.json')) {
          fs.writeFileSync('pipeline-messages.json', JSON.stringify([
            {
              service: 'scraper',
              status: current.scrapeStatus,
              message: `Scraper status: ${current.scrapeStatus}`,
              timestamp: now,
            },
          ], null, 2));
        }

        fs.appendFileSync(process.env.GITHUB_ENV, `SCRAPE_STATUS=${current.scrapeStatus}\nSCRAPE_LISTING_COUNT=${current.listingCount}\n`);
        console.log(`Sahibinden scrape status: ${current.scrapeStatus}; listings=${current.listingCount}`);
        NODE

        status=$(node --input-type=module <<'NODE'
        import fs from 'node:fs';

        try {
          const output = JSON.parse(fs.readFileSync('output.json', 'utf8'));
          const listingCount = Number(output.runMeta?.listingCount ?? output.totalClean ?? output.allListings?.length ?? 0);
          console.log(String(output.runMeta?.scrapeStatus || (listingCount > 0 ? 'SCRAPE_COMPLETED' : 'SCRAPE_EMPTY')));
        } catch {
          console.log('NO_OUTPUT');
        }
        NODE
        )

        if [ "$scraper_code" -ne 0 ]; then
          case "$status" in
            SCRAPE_BLOCKED|SCRAPE_AUTH_REQUIRED|SCRAPE_AUTH_EXPIRED|SCRAPE_EMPTY)
              echo "Soft scraper status: $status; artifactler yuklensin diye workflow devam ediyor."
              exit 0
              ;;
            *)
              exit "$scraper_code"
              ;;
          esac
        fi

    - name: Scrape status oku
      id: scrape_status
      if: always()
      run: |
        node --input-type=module <<'NODE'
        import fs from 'node:fs';

        let status = 'NO_OUTPUT';
        let listingCount = 0;

        try {
          if (fs.existsSync('output.json')) {
            const output = JSON.parse(fs.readFileSync('output.json', 'utf8'));
            listingCount = Number(output.runMeta?.listingCount ?? output.totalClean ?? output.allListings?.length ?? 0);
            status = String(output.runMeta?.scrapeStatus || (listingCount > 0 ? 'SCRAPE_COMPLETED' : 'SCRAPE_EMPTY'));
          }
        } catch (err) {
          status = 'SCRAPE_OUTPUT_INVALID';
          console.log(`output.json okunamadi: ${err.message}`);
        }

        fs.appendFileSync(process.env.GITHUB_OUTPUT, `status=${status}\nlisting_count=${listingCount}\n`);
        console.log(`Sahibinden scrape status: ${status}; listings=${listingCount}`);
        NODE

    - name: Sonuç ve Hata Kanıtlarını Artifact Olarak Al
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: scraper-results-${{ github.run_id }}
        path: |
          output.json
          pipeline-messages.json
          cf_proof.png
          scraper.log
        if-no-files-found: warn

    - name: 2elAnaliz Dashboard'u Tetikle
      if: success() && steps.scrape_status.outputs.status == 'SCRAPE_COMPLETED'
      env:
        ANALYZER_DISPATCH_TOKEN: ${{ secrets.ANALYZER_DISPATCH_TOKEN }}
        ANALYZER_REPO_OWNER: ${{ vars.ANALYZER_REPO_OWNER || 'univerisr-ai' }}
        ANALYZER_REPO_NAME: ${{ vars.ANALYZER_REPO_NAME || '2elAnaliz' }}
        ANALYZER_DISPATCH_EVENT: ${{ vars.ANALYZER_DISPATCH_EVENT || 'telegram_file_ready' }}
      run: |
        node --input-type=module <<'NODE'
        import fs from 'node:fs';

        const token = process.env.ANALYZER_DISPATCH_TOKEN || '';
        if (!token) {
          console.log('Analyzer dispatch atlandi: ANALYZER_DISPATCH_TOKEN tanimli degil.');
          process.exit(0);
        }

        if (!fs.existsSync('output.json')) {
          throw new Error('output.json bulunamadi; analyzer tetiklenemiyor.');
        }

        const output = JSON.parse(fs.readFileSync('output.json', 'utf8'));
        const meta = output.runMeta || {};
        const runId = process.env.GITHUB_RUN_ID || '';
        const sourceRepo = process.env.GITHUB_REPOSITORY || '';
        const artifactName = `scraper-results-${runId || 'local'}`;
        const listingCount = Number(meta.listingCount ?? output.totalClean ?? output.allListings?.length ?? 0);
        const scrapeStatus = meta.scrapeStatus || (listingCount > 0 ? 'SCRAPE_COMPLETED' : 'SCRAPE_EMPTY');
        const owner = process.env.ANALYZER_REPO_OWNER || 'univerisr-ai';
        const repo = process.env.ANALYZER_REPO_NAME || '2elAnaliz';
        const eventType = process.env.ANALYZER_DISPATCH_EVENT || 'telegram_file_ready';

        const response = await fetch(`https://api.github.com/repos/${owner}/${repo}/dispatches`, {
          method: 'POST',
          headers: {
            Authorization: `Bearer ${token}`,
            Accept: 'application/vnd.github+json',
            'Content-Type': 'application/json',
            'X-GitHub-Api-Version': '2022-11-28',
          },
          body: JSON.stringify({
            event_type: eventType,
            client_payload: {
              github_run_id: runId,
              source_repository: sourceRepo,
              source_run_url: runId && sourceRepo ? `https://github.com/${sourceRepo}/actions/runs/${runId}` : '',
              artifact_name: artifactName,
              scrape_status: scrapeStatus,
              listing_count: listingCount,
              started_at: meta.startedAt || '',
              finished_at: meta.finishedAt || output.timestamp || '',
              pipeline_message: listingCount > 0
                ? 'Scraper ilanlari cekti; output.json analyzer servisine iletildi.'
                : 'Scraper calisti ancak temiz ilan bulunamadi; analyzer servisine iletildi.',
              is_fallback: Boolean(output.isFallback),
            },
          }),
        });

        if (response.status !== 204) {
          throw new Error(`Analyzer dispatch basarisiz: HTTP ${response.status} ${await response.text()}`);
        }

        console.log(`Analyzer dispatch tetiklendi: ${owner}/${repo}, artifact=${artifactName}, listings=${listingCount}`);
        NODE
