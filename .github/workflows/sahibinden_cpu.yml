name: CPU Firsat Avcisi - Sahibinden Scraper

on:
  schedule:
    # Her gun 10:00 UTC tetiklenir; workflow icinde haftada 2 rastgele gun politikasi uygulanir.
    - cron: '0 10 * * *'
  workflow_dispatch:
    inputs:
      min_fiyat:
        description: 'Minimum fiyat filtresi (TL, opsiyonel)'
        required: false
        default: ''
      max_fiyat:
        description: 'Maximum fiyat filtresi (TL, opsiyonel)'
        required: false
        default: ''
      max_pages_per_segment:
        description: 'Segment basina maksimum sayfa'
        required: false
        default: '60'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

concurrency:
  group: sahibinden-cpu-${{ github.ref }}
  cancel-in-progress: false

jobs:
  scrape-cpu:
    name: CPU scrape
    runs-on: ubuntu-latest
    # 120 dk gereksizdi: kotu durumda (WARP/CF blok) scraper devre kesici ile zaten
    # erken cikiyor. Tavani 30 dk'ya cekerek takilan kosularin dakika israfini onluyoruz.
    timeout-minutes: 30
    # GPU scraper ile AYNI camoufox/flaresolverr/WARP altyapisini kullanir; plain
    # chromium sahibinden tarafindan bloklaniyordu (net::ERR_ABORTED).
    container:
      image: ghcr.io/univerisr-ai/ahibinden-ekran-karti/scraper:latest
      options: --privileged --user root

    services:
      flaresolverr:
        image: ghcr.io/flaresolverr/flaresolverr:latest
        env:
          LOG_LEVEL: info
          PROXY_URL: socks5://127.0.0.1:40000

    steps:
      - name: Haftalik run politikasi (2 rastgele gun)
        id: run_policy
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual tetikleme: policy bypass, CPU kosusu basliyor."
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "${{ vars.PIPELINE_PAUSED }}" = "true" ] || [ "${{ vars.CPU_PIPELINE_PAUSED }}" = "true" ]; then
            echo "Run policy: pipeline pause acik oldugu icin CPU schedule kosusu atlanacak."
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          week="$(date -u +%G-%V)"
          dow="$(date -u +%u)" # 1=Mon ... 7=Sun
          seed_input="${GITHUB_REPOSITORY}|${week}|sahibinden-cpu-weekly-two-days"
          seed_hash="$(printf "%s" "$seed_input" | sha256sum | cut -d' ' -f1)"
          day1_seed=$((16#${seed_hash:0:6}))
          day2_seed=$((16#${seed_hash:6:6}))

          day1=$(( (day1_seed % 7) + 1 ))
          day2=$(( (day2_seed % 7) + 1 ))
          if [ "$day2" -eq "$day1" ]; then
            day2=$(( (day1 % 7) + 1 ))
          fi

          echo "Week: $week | UTC day: $dow | Picked days: $day1,$day2"

          if [ "$dow" -eq "$day1" ] || [ "$dow" -eq "$day2" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "Run policy: Bugun CPU icin secili gunlerden biri, kosu devam edecek."
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "Run policy: Bugun CPU icin secili gun degil, schedule kosusu atlanacak."
          fi

      - name: Checkout
        if: steps.run_policy.outputs.should_run == 'true'
        uses: actions/checkout@v4

      - name: Cache Playwright storage state
        if: steps.run_policy.outputs.should_run == 'true'
        uses: actions/cache@v4
        with:
          path: .playwright/storage-state.json
          key: sahibinden-storage-state-${{ runner.os }}-cpu-${{ github.run_id }}
          restore-keys: |
            sahibinden-storage-state-${{ runner.os }}-cpu-

      - name: Incremental seen-store cache
        if: steps.run_policy.outputs.should_run == 'true'
        uses: actions/cache@v4
        with:
          path: state
          key: sahibinden-seen-cpu-${{ github.run_id }}
          restore-keys: |
            sahibinden-seen-cpu-

      - name: WARP Proxy
        if: steps.run_policy.outputs.should_run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          warp-svc > /tmp/warp-svc.log 2>&1 &
          sleep 4
          warp-cli --accept-tos registration new 2>/dev/null || warp-cli --accept-tos register
          warp-cli --accept-tos mode proxy 2>/dev/null || warp-cli --accept-tos set-mode proxy
          warp-cli --accept-tos proxy port 40000 2>/dev/null || warp-cli --accept-tos set-proxy-port 40000
          warp-cli --accept-tos connect
          sleep 8
          warp-cli --accept-tos status
          curl -fsS -x socks5h://127.0.0.1:40000 https://www.cloudflare.com/cdn-cgi/trace | tee warp-trace.txt

      - name: Start Camoufox Server
        if: steps.run_policy.outputs.should_run == 'true'
        id: camoufox_server
        shell: bash
        env:
          HOME: /root
          CAMOUFOX_HEADLESS: false
          CAMOUFOX_PROXY: socks5://127.0.0.1:40000
        run: |
          xvfb-run -a python3 scripts/camoufox-server.py > /tmp/camoufox-server.log 2>&1 &
          SERVER_PID=$!
          echo "server_pid=$SERVER_PID" >> "$GITHUB_OUTPUT"
          WS=""
          for i in $(seq 1 60); do
            if grep -q "Websocket endpoint" /tmp/camoufox-server.log 2>/dev/null; then
              WS=$(grep -oP 'ws://[^\s]+' /tmp/camoufox-server.log | head -1)
              echo "camoufox_ws=$WS" >> "$GITHUB_OUTPUT"
              echo "Camoufox server ready: $WS"
              break
            fi
            sleep 2
          done
          if [ -z "$WS" ]; then
            echo "Camoufox server failed to start"
            cat /tmp/camoufox-server.log
            exit 1
          fi

      - name: CPU scraper calistir
        if: steps.run_policy.outputs.should_run == 'true'
        shell: bash
        env:
          SAHIBINDEN_PRODUCT_TYPE: 'cpu'
          CAMOUFOX_WS_ENDPOINT: ${{ steps.camoufox_server.outputs.camoufox_ws }}
          FLARESOLVERR_URL: http://flaresolverr:8191/v1

          HEADLESS: 'true'
          REQUIRE_SAHIBINDEN_COOKIES: 'false'
          SAHIBINDEN_STORAGE_STATE_FILE: .playwright/storage-state.json
          SAHIBINDEN_STORAGE_STATE_B64: ${{ secrets.SAHIBINDEN_STORAGE_STATE_B64 }}
          SAHIBINDEN_COOKIES: ${{ secrets.SAHIBINDEN_COOKIES }}

          MAX_PAGES_PER_SEGMENT: ${{ github.event.inputs.max_pages_per_segment || '60' }}
          PARALLEL_SEGMENTS: '2'

          TELEGRAM_BOT_TOKEN_1: ${{ secrets.TELEGRAM_BOT_TOKEN_1 }}
          TELEGRAM_BOT_TOKEN_2: ${{ secrets.TELEGRAM_BOT_TOKEN_2 }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ENABLE_TELEGRAM: 'false'

          ANALYZER_DISPATCH_TOKEN: ${{ secrets.ANALYZER_DISPATCH_TOKEN }}
          ANALYZER_REPO_OWNER: ${{ vars.ANALYZER_REPO_OWNER || 'univerisr-ai' }}
          ANALYZER_REPO_NAME: ${{ vars.ANALYZER_REPO_NAME || '2elAnaliz' }}
          ANALYZER_DISPATCH_EVENT: ${{ vars.ANALYZER_DISPATCH_EVENT || 'telegram_file_ready' }}

          AI_PROVIDER: ${{ vars.AI_PROVIDER || '' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CUSTOM_MIN_PRICE: ${{ github.event.inputs.min_fiyat || '' }}
          CUSTOM_MAX_PRICE: ${{ github.event.inputs.max_fiyat || '' }}
          BYPASS_AI: 'true'

          # Incremental scraping: repo variable INCREMENTAL_SCRAPE=true yapinca aktiflesir.
          INCREMENTAL_SCRAPE: ${{ vars.INCREMENTAL_SCRAPE || 'false' }}
          SEEN_STATE_DIR: state
        run: |
          npm ci --no-optional --ignore-scripts
          node src/main.mjs 2>&1 | tee scraper.log

      - name: Kill Camoufox
        if: always() && steps.run_policy.outputs.should_run == 'true'
        shell: bash
        run: |
          kill ${{ steps.camoufox_server.outputs.server_pid }} 2>/dev/null || true

      - name: Sonuclari artifact olarak al
        if: always() && steps.run_policy.outputs.should_run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: scraper-results-cpu-${{ github.run_id }}
          path: |
            output.json
            pipeline-messages.json
            cf_proof.png
            scraper.log
            warp-trace.txt
          retention-days: 7
          if-no-files-found: ignore

      - name: Telegram failure alert
        if: failure() && steps.run_policy.outputs.should_run == 'true'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TELEGRAM_BOT_TOKEN_1: ${{ secrets.TELEGRAM_BOT_TOKEN_1 }}
          TELEGRAM_BOT_TOKEN_2: ${{ secrets.TELEGRAM_BOT_TOKEN_2 }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set +e

          TOKEN="${TELEGRAM_BOT_TOKEN_1:-${TELEGRAM_BOT_TOKEN_2:-}}"
          CHAT_ID="${TELEGRAM_CHAT_ID:-}"

          if [ -z "$TOKEN" ] || [ -z "$CHAT_ID" ]; then
            echo "Telegram alert skipped: token/chat id missing."
            exit 0
          fi

          summary="$(grep -m 1 -E 'Error:|ERR!|Traceback|Exception|FATAL|KRITIK|CRITICAL|DEVRE KESICI|❌' scraper.log 2>/dev/null || true)"
          if [ -z "$summary" ]; then
            summary="Ilk hata ozeti otomatik cikarilamadi; CPU run logunu kontrol et."
          fi
          summary="${summary//$'\r'/ }"
          summary="${summary//$'\n'/ }"

          message="CPU pipeline alarmi
          Repo: $GITHUB_REPOSITORY
          Run URL: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID
          Ozet: ${summary:0:700}"

          curl -fsS -X POST "https://api.telegram.org/bot$TOKEN/sendMessage" \
            --data-urlencode "chat_id=$CHAT_ID" \
            --data-urlencode "text=$message" >/dev/null || true
