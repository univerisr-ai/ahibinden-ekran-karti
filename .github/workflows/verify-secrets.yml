name: Verify repository secrets

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-repository-secrets
  cancel-in-progress: false

jobs:
  verify-sahibinden-cookies:
    name: Verify SAHIBINDEN_COOKIES
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check secret is configured
        shell: bash
        env:
          SAHIBINDEN_COOKIES: ${{ secrets.SAHIBINDEN_COOKIES }}
        run: |
          set -euo pipefail

          if [ -z "${SAHIBINDEN_COOKIES:-}" ]; then
            echo "::error title=Missing secret::SAHIBINDEN_COOKIES is not configured for this repository."
            exit 1
          fi

          echo "SAHIBINDEN_COOKIES is configured and accessible to this workflow."
