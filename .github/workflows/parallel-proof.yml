name: Parallel Page Proof of Concept

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'test/test-*.mjs'
      - '.github/workflows/parallel-proof.yml'

jobs:
  parallel-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      flaresolverr:
        image: ghcr.io/flaresolverr/flaresolverr:latest
        env:
          LOG_LEVEL: info
          PROXY_URL: socks5://host.docker.internal:40000

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Install Camoufox + download browser
        run: |
          pip install --upgrade pip 2>/dev/null || true
          pip install "camoufox[geoip]>=0.4" 2>/dev/null || true
          python3 -m camoufox fetch 2>&1 | tail -5
          sudo apt-get install -y xvfb 2>/dev/null || true

      - name: Get Camoufox binary path
        id: camoufox-bin
        shell: bash
        run: |
          CAMO_DIR=$(python3 -m camoufox path 2>/dev/null || echo "$HOME/.cache/camoufox")
          echo "Camoufox dir: $CAMO_DIR"
          BIN=$(find "$CAMO_DIR" -type f \( -name "camoufox-bin" -o -name "firefox-bin" -o -name "firefox" \) 2>/dev/null | head -1)
          if [ -z "$BIN" ]; then
            BIN=$(find "$CAMO_DIR" -type f -executable 2>/dev/null | head -1)
          fi
          if [ -z "$BIN" ]; then
            echo "No binary found!" && exit 1
          fi
          chmod +x "$BIN" 2>/dev/null || true
          echo "bin_path=$BIN" >> "$GITHUB_OUTPUT"
          file "$BIN"

      - name: Cloudflare WARP Proxy
        id: warp
        shell: bash
        run: |
          set -u
          if (
            set -euo pipefail
            curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg | sudo gpg --yes --dearmor --output /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
            echo "deb [arch=amd64 signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/cloudflare-client.list
            sudo apt-get update
            sudo apt-get install -y cloudflare-warp
            warp-cli --accept-tos registration new || warp-cli --accept-tos register
            warp-cli --accept-tos mode proxy || warp-cli --accept-tos set-mode proxy
            warp-cli --accept-tos proxy port 40000 || warp-cli --accept-tos set-proxy-port 40000
            warp-cli --accept-tos connect
            sleep 8
            warp-cli --accept-tos status
            curl -fsS -x socks5h://127.0.0.1:40000 https://www.cloudflare.com/cdn-cgi/trace | tee warp-trace.txt
          ); then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "proxy_url=socks5://127.0.0.1:40000" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "proxy_url=" >> "$GITHUB_OUTPUT"
          fi

      - name: Cache storage state
        uses: actions/cache@v4
        with:
          path: .playwright/storage-state.json
          key: sahibinden-storage-state-Linux-${{ github.run_id }}
          restore-keys: |
            sahibinden-storage-state-Linux-

      - name: Test FlareSolverr connectivity
        shell: bash
        run: |
          echo "Testing FlareSolverr..."
          curl -fsS -m 5 http://flaresolverr:8191/v1 && echo "OK" || echo "FAILED"
          curl -fsS -m 10 -X POST http://flaresolverr:8191/v1 \
            -H "Content-Type: application/json" \
            -d "{\"cmd\":\"request.get\",\"url\":\"https://httpbin.org/ip\",\"maxTimeout\":30000}" \
            > /tmp/fs-test.json 2>&1 && cat /tmp/fs-test.json || echo "FlareSolverr test failed"

      - name: Run parallel test (test-main.mjs)
        env:
          CAMOUFOX_BIN: ${{ steps.camoufox-bin.outputs.bin_path }}
          CAMOUFOX_PROXY: socks5://127.0.0.1:40000
          FLARESOLVERR_URL: http://flaresolverr:8191/v1
          HEADLESS: 'true'
          PARALLEL_PAGES: '10'
          MAX_PAGES_PER_SEGMENT: '3'
          CUSTOM_MIN_PRICE: '0'
          CUSTOM_MAX_PRICE: '2000'
          BYPASS_AI: 'true'
          ENABLE_TELEGRAM: 'false'
          SAHIBINDEN_STORAGE_STATE_B64: ${{ secrets.SAHIBINDEN_STORAGE_STATE_B64 }}
          SAHIBINDEN_STORAGE_STATE_FILE: .playwright/storage-state.json
          SAHIBINDEN_COOKIES: ${{ secrets.SAHIBINDEN_COOKIES }}
          TELEGRAM_BOT_TOKEN_1: ${{ secrets.TELEGRAM_BOT_TOKEN_1 }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node test/test-main.mjs

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parallel-proof-results
          path: |
            output.json
            pipeline-messages.json
            cf_proof.png
            scraper.log
          if-no-files-found: warn
          retention-days: 7
