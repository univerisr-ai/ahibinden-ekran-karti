name: Parallel Page Proof of Concept

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/*.mjs'
      - '.github/workflows/parallel-proof.yml'
      - 'src/config.mjs'

jobs:
  parallel-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies + Playwright Chromium
        run: |
          npm ci
          npx playwright install chromium
          npx playwright install-deps chromium

      - name: Cloudflare WARP Proxy
        id: warp
        shell: bash
        run: |
          set -u
          if (
            set -euo pipefail
            curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg | sudo gpg --yes --dearmor --output /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
            echo "deb [arch=amd64 signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/cloudflare-client.list
            sudo apt-get update
            sudo apt-get install -y cloudflare-warp
            warp-cli --accept-tos registration new || warp-cli --accept-tos register
            warp-cli --accept-tos mode proxy || warp-cli --accept-tos set-mode proxy
            warp-cli --accept-tos proxy port 40000 || warp-cli --accept-tos set-proxy-port 40000
            warp-cli --accept-tos connect
            sleep 8
            warp-cli --accept-tos status
            curl -fsS -x socks5h://127.0.0.1:40000 https://www.cloudflare.com/cdn-cgi/trace | tee warp-trace.txt
          ); then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "proxy_url=socks5://127.0.0.1:40000" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "proxy_url=" >> "$GITHUB_OUTPUT"
          fi

      - name: Start FlareSolverr with host network
        shell: bash
        run: |
          docker run -d --name flaresolverr --network host \
            -e LOG_LEVEL=info \
            ghcr.io/flaresolverr/flaresolverr:latest
          for i in $(seq 1 20); do
            if curl -s --noproxy '*' -m 3 http://127.0.0.1:8191/v1 -X POST -H 'Content-Type: application/json' -d '{"cmd":"request.get","url":"https://httpbin.org/ip","maxTimeout":10000}' >/dev/null 2>&1; then
              echo "FlareSolverr ready on port 8191"
              break
            fi
            sleep 2
          done

      - name: Cache storage state
        uses: actions/cache@v4
        with:
          path: .playwright/storage-state.json
          key: sahibinden-storage-state-Linux-${{ github.run_id }}
          restore-keys: |
            sahibinden-storage-state-Linux-

      - name: Run parallel test (src/main.mjs)
        env:
          FLARESOLVERR_URL: http://127.0.0.1:8191/v1
          HEADLESS: 'true'
          PARALLEL_PAGES: '10'
          MAX_PAGES_PER_SEGMENT: '5'
          REQUEST_DELAY_MS: '300'
          BYPASS_AI: 'true'
          ENABLE_TELEGRAM: 'false'
          SAHIBINDEN_STORAGE_STATE_B64: ${{ secrets.SAHIBINDEN_STORAGE_STATE_B64 }}
          SAHIBINDEN_STORAGE_STATE_FILE: .playwright/storage-state.json
          SAHIBINDEN_COOKIES: ${{ secrets.SAHIBINDEN_COOKIES }}
          TELEGRAM_BOT_TOKEN_1: ${{ secrets.TELEGRAM_BOT_TOKEN_1 }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node src/main.mjs

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parallel-proof-results
          path: |
            output.json
            pipeline-messages.json
            cf_proof.png
            init_session.png
            scraper.log
          if-no-files-found: warn
          retention-days: 7
