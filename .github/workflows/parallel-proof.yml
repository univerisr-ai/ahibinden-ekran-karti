name: Parallel Page Proof of Concept

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'test/test-*.mjs'
      - '.github/workflows/parallel-proof.yml'

jobs:
  parallel-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      flaresolverr:
        image: ghcr.io/flaresolverr/flaresolverr:latest
        env:
          LOG_LEVEL: info
          PROXY_URL: socks5://127.0.0.1:40000

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Install Camoufox + deps
        run: |
          pip install --upgrade pip 2>/dev/null || true
          pip install "camoufox[geoip]>=0.4" playwright websockets requests pyyaml 2>/dev/null || true
          playwright install chromium 2>&1 | tail -3
          python3 -m camoufox fetch 2>&1 | tail -3
          sudo apt-get install -y xvfb 2>/dev/null || true

      - name: Fix Playwright driver for Camoufox compat
        shell: bash
        run: |
          DRIVER_LIB=$(python3 -c "import pathlib; from playwright._impl._driver import compute_driver_executable; p = compute_driver_executable()[0]; print(pathlib.Path(p).parent / 'package' / 'lib')" 2>/dev/null)
          echo "Driver lib: $DRIVER_LIB"
          ls "$DRIVER_LIB/" 2>/dev/null || echo "dir not found"
          MISSING="$DRIVER_LIB/browserServerImpl.js"
          if [ ! -f "$MISSING" ]; then
            echo "browserServerImpl.js missing, searching..."
            FOUND=$(find "$DRIVER_LIB/.." -name "browserServerImpl.js" 2>/dev/null | head -1)
            if [ -n "$FOUND" ]; then
              echo "Found at: $FOUND"
              ln -sf "$FOUND" "$MISSING" && echo "Symlink created"
            else
              echo "browserServerImpl.js not found. Available JS files:"
              find "$DRIVER_LIB/.." -name "*.js" -type f 2>/dev/null | head -30
            fi
          else
            echo "browserServerImpl.js exists"
          fi

      - name: Cloudflare WARP Proxy
        id: warp
        shell: bash
        run: |
          set -u
          if (
            set -euo pipefail
            curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg | sudo gpg --yes --dearmor --output /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
            echo "deb [arch=amd64 signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/cloudflare-client.list
            sudo apt-get update
            sudo apt-get install -y cloudflare-warp
            warp-cli --accept-tos registration new || warp-cli --accept-tos register
            warp-cli --accept-tos mode proxy || warp-cli --accept-tos set-mode proxy
            warp-cli --accept-tos proxy port 40000 || warp-cli --accept-tos set-proxy-port 40000
            warp-cli --accept-tos connect
            sleep 8
            warp-cli --accept-tos status
            curl -fsS -x socks5h://127.0.0.1:40000 https://www.cloudflare.com/cdn-cgi/trace | tee warp-trace.txt
          ); then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "proxy_url=socks5://127.0.0.1:40000" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "proxy_url=" >> "$GITHUB_OUTPUT"
          fi

      - name: Start Camoufox server
        id: camoufox
        shell: bash
        run: |
          CAMOUFOX_HEADLESS=true CAMOUFOX_PROXY=socks5://127.0.0.1:40000 \
            xvfb-run python3 scripts/camoufox-server.py \
            > /tmp/camoufox-server.log 2>&1 &
          SERVER_PID=$!
          echo "server_pid=$SERVER_PID" >> "$GITHUB_OUTPUT"

          for i in $(seq 1 90); do
            if grep -q "Websocket endpoint" /tmp/camoufox-server.log 2>/dev/null; then
              WS=$(grep -oP 'ws://[^\s]+' /tmp/camoufox-server.log | head -1)
              echo "camoufox_ws=$WS" >> "$GITHUB_OUTPUT"
              echo "Camoufox server ready: $WS"
              break
            fi
            if grep -q "Server error\|Traceback\|Error:" /tmp/camoufox-server.log 2>/dev/null; then
              echo "Camoufox server error detected"
              cat /tmp/camoufox-server.log
              exit 1
            fi
            sleep 2
          done

          if [ -z "$WS" ]; then
            echo "Camoufox server failed to start"
            cat /tmp/camoufox-server.log
            exit 1
          fi

      - name: Cache storage state
        uses: actions/cache@v4
        with:
          path: .playwright/storage-state.json
          key: sahibinden-storage-state-Linux-${{ github.run_id }}
          restore-keys: |
            sahibinden-storage-state-Linux-

      - name: Run parallel test (test-main.mjs)
        env:
          CAMOUFOX_WS_ENDPOINT: ${{ steps.camoufox.outputs.camoufox_ws }}
          HEADLESS: 'true'
          PARALLEL_PAGES: '10'
          MAX_PAGES_PER_SEGMENT: '3'
          CUSTOM_MIN_PRICE: '0'
          CUSTOM_MAX_PRICE: '2000'
          BYPASS_AI: 'true'
          ENABLE_TELEGRAM: 'false'
          SAHIBINDEN_STORAGE_STATE_B64: ${{ secrets.SAHIBINDEN_STORAGE_STATE_B64 }}
          SAHIBINDEN_STORAGE_STATE_FILE: .playwright/storage-state.json
          SAHIBINDEN_COOKIES: ${{ secrets.SAHIBINDEN_COOKIES }}
          TELEGRAM_BOT_TOKEN_1: ${{ secrets.TELEGRAM_BOT_TOKEN_1 }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node test/test-main.mjs

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parallel-proof-results
          path: |
            output.json
            pipeline-messages.json
            cf_proof.png
            scraper.log
          if-no-files-found: warn
          retention-days: 7
