name: Parallel Page Proof of Concept

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'test/test-*.mjs'
      - '.github/workflows/parallel-proof.yml'

jobs:
  parallel-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium

      - name: Run parallel test (test-main.mjs)
        env:
          SAHIBINDEN_COOKIES: ${{ secrets.SAHIBINDEN_COOKIES }}
          TELEGRAM_BOT_TOKEN_1: ${{ secrets.TELEGRAM_BOT_TOKEN_1 }}
          TELEGRAM_BOT_TOKEN_2: ${{ secrets.TELEGRAM_BOT_TOKEN_2 }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PARALLEL_PAGES: '10'
          MAX_PAGES_PER_SEGMENT: '5'
          CUSTOM_MIN_PRICE: '0'
          CUSTOM_MAX_PRICE: '2000'
          BYPASS_AI: 'true'
          ENABLE_TELEGRAM: 'true'
        run: node test/test-main.mjs

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parallel-proof-results
          path: |
            output.json
            pipeline-messages.json
            screenshots/
            cf_proof.png
          if-no-files-found: warn
          retention-days: 7
