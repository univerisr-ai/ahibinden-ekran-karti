name: Test Login Page Access

on:
  workflow_dispatch:

jobs:
  test-login:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install

      - name: Install Camoufox
        run: pip install camoufox orjson

      - name: Test login page access with Camoufox
        run: python3 scripts/test-login.py

      - name: Upload screenshot
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: login-test-screenshot
          path: test-sahibinden-giris.png
